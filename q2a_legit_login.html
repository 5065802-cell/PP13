<!DOCTYPE html>
<html>
<head>
  <title>SafeBank Login</title>
  <style>
    body { font-family: Arial; background: #eef2f5; padding: 40px; }
    .card { width: 320px; margin: auto; background: white; padding: 25px; border-radius: 8px; }
    .url { background: #e8f5e9; padding: 6px; font-size: 13px; color: green; margin-bottom: 12px; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    button { background: #1a73e8; color: white; border: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="url">HTTPS: https://www.safebank.com/login</div>
    <h2>SafeBank Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <button>Sign In</button>
  </div>
</body>
</html>
